<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindacell — Links</title>
<meta name="description" content="Todos os links da Blindacell: curso, grupo VIP, agendamento e avaliações.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700;800&display=optional">
<style>
  :root{
    --ink:#191510;
    --ink-2:#221C14;
    --blue:#1B4FE0;
    --blue-light:#3D6BFF;
    --clay:#B8AF9F;
    --line: rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:radial-gradient(circle at 50% 0%, #241D14 0%, var(--ink) 55%);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .card{width:100%; max-width:420px; text-align:center;}
  .logo{font-family:'Sora',sans-serif; font-weight:800; font-size:23px; letter-spacing:-0.01em; color:#fff; margin-bottom:6px;}
  .logo span{color:var(--blue-light);}
  .subtitle{font-size:15px; color:var(--clay); font-weight:600; margin-bottom:8px;}
  .cta-line{font-size:14px; font-weight:800; color:var(--blue-light); margin-bottom:28px;}
  .links{display:flex; flex-direction:column; gap:14px;}
  .link-btn{
    display:flex; align-items:center; gap:16px;
    text-decoration:none; padding:18px 20px; border-radius:16px;
    background:var(--ink-2); border:1px solid var(--line);
    text-align:left; position:relative; overflow:hidden;
    transition:transform .15s ease;
  }
  .link-btn:active{transform:scale(0.97);}
  .link-btn.primary{
    background:linear-gradient(135deg, var(--blue) 0%, #1440BD 100%);
    border-color:transparent;
    box-shadow:0 8px 22px rgba(27,79,224,0.35);
  }
  .link-btn::before{
    content:""; position:absolute; top:0; left:0; right:0; height:46%;
    background:linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0));
    pointer-events:none;
  }
  .link-btn::after{
    content:""; position:absolute; top:0; left:-60%; width:34%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.22), transparent);
    transform:skewX(-18deg);
    animation:btn-sheen 4.8s ease-in-out infinite;
    pointer-events:none;
  }
  .link-btn:nth-child(1)::after{ animation-delay:0s; }
  .link-btn:nth-child(2)::after{ animation-delay:1.2s; }
  .link-btn:nth-child(3)::after{ animation-delay:2.4s; }
  .link-btn:nth-child(4)::after{ animation-delay:3.6s; }
  @keyframes btn-sheen{
    0%   { left:-60%; }
    22%  { left:130%; }
    100% { left:130%; }
  }
  @media (prefers-reduced-motion: reduce){
    .link-btn::after{ animation:none !important; }
  }
  .link-btn .icon{
    width:46px; height:46px; min-width:46px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; background:rgba(255,255,255,0.08);
  }
  .link-btn.primary .icon{background:rgba(255,255,255,0.18);}
  .link-btn .txt{flex:1; position:relative; z-index:1;}
  .link-btn .txt .main{font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#fff; display:block;}
  .link-btn .txt .sub{font-size:13px; color:rgba(255,255,255,0.6); font-weight:600; margin-top:2px; display:block;}
  .link-btn.primary .txt .sub{color:rgba(255,255,255,0.8);}
  .link-btn .arrow{color:rgba(255,255,255,0.5); font-size:18px; position:relative; z-index:1;}
  footer{margin-top:32px; font-size:12px; color:var(--clay);}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">BLINDA<span>CELL</span></div>
    <p class="subtitle">Blindagem profissional de celulares</p>
    <p class="cta-line">👇 Toque em uma opção abaixo</p>

    <div class="links">
      <a class="link-btn primary" href="https://blindacell.shop" target="_blank">
        <span class="icon">🎓</span>
        <span class="txt">
          <span class="main">Curso Blindacell</span>
          <span class="sub">Aprenda a técnica e comece a atender</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://chat.whatsapp.com/EVWbcuZMVo5H0sJrqABLFH" target="_blank">
        <span class="icon">⭐</span>
        <span class="txt">
          <span class="main">Grupo VIP</span>
          <span class="sub">Descontos e novidades</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://wa.me/5547984638658?text=Ol%C3%A1!%20Vim%20pelo%20Instagram%20e%20quero%20agendar%20uma%20blindagem." target="_blank">
        <span class="icon">📅</span>
        <span class="txt">
          <span class="main">Agendar Blindagem</span>
          <span class="sub">Fale direto no WhatsApp</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://g.page/r/CVQ8NlX9aT5jEBM/review" target="_blank">
        <span class="icon">🌟</span>
        <span class="txt">
          <span class="main">Avaliar no Google</span>
          <span class="sub">Deixe sua avaliação</span>
        </span>
        <span class="arrow">›</span>
      </a>
    </div>

    <footer>© 2026 Blindacell</footer>
  </div>
</body>
</html>
