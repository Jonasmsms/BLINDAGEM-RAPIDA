<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindacell — Links</title>
<meta name="description" content="Todos os links da Blindacell: curso, grupo VIP, agendamento e avaliações.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700;800&display=optional">
<style>
  :root{
    --ink:#191510;
    --clay:#6B6153;
    --blue:#1B4FE0;
    --paper:#F4F1EA;
    --panel:#EDE8DD;
    --line: rgba(25,21,16,0.10);
    --gold:#C9922B;
    --gold-light:#F0C36D;
    --wa-green:#22B159;
    --wa-green-dark:#0F7A3D;
    --g-blue:#3B7CF5;
    --g-blue-dark:#1E4FC4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .card{width:100%; max-width:420px; text-align:center; padding:0 20px 32px;}

  .hero-image-wrap{
    position:relative;
    width:100%;
    margin:0 0 22px;
    line-height:0;
    overflow:hidden;
  }
  .hero-image-wrap img{
    width:100%;
    height:auto;
    display:block;
  }
  .hero-image-wrap::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:30%;
    background:linear-gradient(180deg, rgba(15,12,9,0) 0%, rgba(15,12,9,0.55) 100%);
    pointer-events:none;
  }
  .hero-text{
    position:absolute;
    left:0; right:0; bottom:14px;
    z-index:1;
    padding:0 20px;
    line-height:normal;
  }
  .hero-text .logo{color:#fff; margin-bottom:6px; line-height:1.2;}
  .hero-text .logo span{color:var(--blue-light, #6E8CFF);}
  .hero-text .subtitle{color:rgba(255,255,255,0.85); line-height:1.4; margin-bottom:8px;}
  .hero-text .cta-line{color:#fff; margin-bottom:0; line-height:1.4;}
  .logo{font-family:'Sora',sans-serif; font-weight:800; font-size:23px; letter-spacing:-0.01em; color:var(--ink); margin-bottom:6px;}
  .logo span{color:var(--blue);}
  .subtitle{font-size:15px; color:var(--clay); font-weight:600; margin-bottom:8px;}
  .cta-line{font-size:14px; font-weight:800; color:var(--blue); margin-bottom:26px;}
  .links{display:flex; flex-direction:column; gap:20px; padding-top:6px;}

  .link-btn{
    display:flex; align-items:center; gap:16px;
    text-decoration:none; padding:19px 20px; border-radius:20px;
    background:#fff; border:1px solid rgba(25,21,16,0.06);
    text-align:left; position:relative;
    box-shadow:
      0 1px 2px rgba(25,21,16,0.06),
      0 10px 24px -8px rgba(25,21,16,0.16),
      0 18px 40px -18px rgba(25,21,16,0.20);
    transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s ease;
    animation:btn-glow 3.6s ease-in-out infinite;
  }
  /* brilho de vidro no topo do cartão, reforça a sensação de elevação */
  .link-btn::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
    border-radius:20px 20px 0 0;
    pointer-events:none;
  }
  .link-btn:active{
    transform:scale(0.96) translateY(1px);
    box-shadow:0 1px 2px rgba(25,21,16,0.08), 0 4px 10px -4px rgba(25,21,16,0.18);
  }
  .link-btn.primary{
    background:linear-gradient(160deg, #2E62F2 0%, var(--blue) 55%, #133C9E 100%);
    border-color:transparent;
    box-shadow:
      0 1px 2px rgba(255,255,255,0.25) inset,
      0 12px 26px -8px rgba(27,79,224,0.55),
      0 22px 46px -16px rgba(27,79,224,0.45);
  }
  .link-btn.primary::before{
    background:linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
  }
  .link-btn:nth-child(1){ animation-delay:0s; }
  .link-btn:nth-child(2){ animation-delay:0.9s; }
  .link-btn:nth-child(3){ animation-delay:1.8s; }
  .link-btn:nth-child(4){ animation-delay:2.7s; }

  .link-btn.gold{border-left:3px solid var(--gold);}
  .link-btn.green{border-left:3px solid var(--wa-green);}
  .link-btn.googleblue{border-left:3px solid var(--g-blue);}

  /* brilho colorido saindo do canto inferior direito, efeito contrário à borda esquerda */
  .link-btn.gold, .link-btn.green, .link-btn.googleblue{ z-index:0; }
  .link-btn.gold::after, .link-btn.green::after, .link-btn.googleblue::after{
    content:"";
    position:absolute;
    right:-14px; bottom:-16px;
    width:62%; height:75%;
    border-radius:50%;
    filter:blur(16px);
    opacity:0.5;
    z-index:-1;
    pointer-events:none;
  }
  .link-btn.gold::after{ background:var(--gold); }
  .link-btn.green::after{ background:var(--wa-green); }
  .link-btn.googleblue::after{ background:var(--g-blue); }

  @keyframes btn-glow{
    0%, 76%, 100% {
      box-shadow:0 1px 2px rgba(25,21,16,0.06), 0 10px 24px -8px rgba(25,21,16,0.16), 0 18px 40px -18px rgba(25,21,16,0.20);
      transform:translateY(0);
    }
    38% {
      box-shadow:0 1px 2px rgba(25,21,16,0.06), 0 16px 30px -8px rgba(27,79,224,0.28), 0 24px 48px -16px rgba(27,79,224,0.24);
      transform:translateY(-3px);
    }
  }
  .link-btn.primary{ animation:btn-glow-primary 3.6s ease-in-out infinite; }
  .link-btn.primary:nth-child(1){ animation-delay:0s; }
  @keyframes btn-glow-primary{
    0%, 76%, 100% {
      box-shadow:0 1px 2px rgba(255,255,255,0.25) inset, 0 12px 26px -8px rgba(27,79,224,0.55), 0 22px 46px -16px rgba(27,79,224,0.45);
      transform:translateY(0);
    }
    38% {
      box-shadow:0 1px 2px rgba(255,255,255,0.3) inset, 0 18px 34px -8px rgba(27,79,224,0.68), 0 28px 54px -14px rgba(27,79,224,0.55);
      transform:translateY(-4px);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .link-btn{ animation:none !important; }
  }

  .link-btn .icon{
    width:50px; height:50px; min-width:50px; border-radius:15px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, #fff 0%, var(--panel) 100%);
    box-shadow:0 2px 5px rgba(25,21,16,0.10), inset 0 1px 0 rgba(255,255,255,0.8);
    position:relative; z-index:1;
  }
  .link-btn .icon svg{width:24px; height:24px;}
  .link-btn.primary .icon{
    background:linear-gradient(160deg, rgba(255,255,255,0.30), rgba(255,255,255,0.10));
    box-shadow:0 2px 6px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.35);
    color:#fff;
  }
  .link-btn.gold .icon{
    background:linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 100%);
    box-shadow:0 4px 10px -2px rgba(201,146,43,0.55), inset 0 1px 0 rgba(255,255,255,0.5);
    color:#fff;
  }
  .link-btn.green .icon{
    background:linear-gradient(160deg, var(--wa-green) 0%, var(--wa-green-dark) 100%);
    box-shadow:0 4px 10px -2px rgba(15,122,61,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    color:#fff;
  }
  .link-btn.googleblue .icon{
    background:linear-gradient(160deg, var(--g-blue) 0%, var(--g-blue-dark) 100%);
    box-shadow:0 4px 10px -2px rgba(30,79,196,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    color:#fff;
  }
  .link-btn .txt{flex:1; position:relative; z-index:1;}
  .link-btn .txt .main{font-family:'Sora',sans-serif; font-weight:800; font-size:17px; color:var(--ink); display:block; letter-spacing:-0.01em;}
  .link-btn .txt .sub{font-size:13.5px; color:#4A443C; font-weight:700; margin-top:3px; display:block;}
  .link-btn.primary .txt .main{color:#fff;}
  .link-btn.primary .txt .sub{color:rgba(255,255,255,0.85);}
  .link-btn .arrow{color:var(--clay); font-size:18px; position:relative; z-index:1;}
  .link-btn.primary .arrow{color:rgba(255,255,255,0.85);}
  footer{margin-top:32px; font-size:12px; color:var(--clay);}
</style>
</head>
<body>
  <div class="hero-image-wrap">
    <img src="hero-image.jpg" alt="Martelo batendo na tela de um celular protegido pela blindagem Blindacell" width="900" height="999">
    <div class="hero-text">
      <div class="logo">BLINDA<span>CELL</span></div>

  <div class="card">

      <a class="link-btn primary" href="https://blindacell.shop" target="_blank">

      <a class="link-btn green" href="https://wa.me/5547984638658?text=Ol%C3%A1!%20Vim%20pelo%20Instagram%20e%20quero%20agendar%20uma%20blindagem." target="_blank">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 14.5l2 2 4.5-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

      <a class="link-btn googleblue" href="https://g.page/r/CVQ8NlX9aT5jEBM/review" target="_blank">
        <span class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l3.1 6.5 7.1.9-5.2 5 1.3 7.1L12 18.3 5.7 22l1.3-7.1-5.2-5 7.1-.9L12 2.5z"/></svg></span>
        <span class="txt">

    </div>

    <footer>© 2026 Blindacell</footer>
  </div>
</body>
</html>
