<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindacell — Links</title>
<meta name="description" content="Todos os links da Blindacell: curso, grupo VIP, agendamento e avaliações.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700;800&display=optional">
<style>
  :root{
    --ink:#191510;
    --clay:#6B6153;
    --blue:#1B4FE0;
    --paper:#F4F1EA;
    --panel:#EDE8DD;
    --line: rgba(25,21,16,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .card{width:100%; max-width:420px; text-align:center;}

  .hero-block{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    padding:32px 20px 26px;
    margin-bottom:22px;
    background:
      linear-gradient(180deg, rgba(25,21,16,0.55) 0%, rgba(25,21,16,0.78) 100%),
      linear-gradient(135deg, #2A2118 0%, var(--ink) 100%);
    background-size:cover;
    background-position:center;
  }
  .hero-block .logo,
  .hero-block .subtitle,
  .hero-block .cta-line{
    position:relative;
    z-index:1;
  }
  .hero-block .logo{color:#fff; margin-bottom:6px;}
  .hero-block .logo span{color:var(--blue);}
  .hero-block .subtitle{color:rgba(255,255,255,0.75);}
  .hero-block .cta-line{color:#fff; margin-bottom:0;}
  .logo{font-family:'Sora',sans-serif; font-weight:800; font-size:23px; letter-spacing:-0.01em; color:var(--ink); margin-bottom:6px;}
  .logo span{color:var(--blue);}
  .subtitle{font-size:15px; color:var(--clay); font-weight:600; margin-bottom:8px;}
  .cta-line{font-size:14px; font-weight:800; color:var(--blue); margin-bottom:26px;}
  .links{display:flex; flex-direction:column; gap:14px;}

  .link-btn{
    display:flex; align-items:center; gap:16px;
    text-decoration:none; padding:18px 20px; border-radius:16px;
    background:#fff; border:1.5px solid var(--line);
    text-align:left; position:relative;
    box-shadow:0 2px 8px rgba(25,21,16,0.04);
    animation:btn-glow 3.6s ease-in-out infinite;
  }
  .link-btn:active{transform:scale(0.97);}
  .link-btn.primary{
    background:var(--blue);
    border-color:transparent;
  }
  .link-btn:nth-child(1){ animation-delay:0s; }
  .link-btn:nth-child(2){ animation-delay:0.9s; }
  .link-btn:nth-child(3){ animation-delay:1.8s; }
  .link-btn:nth-child(4){ animation-delay:2.7s; }

  @keyframes btn-glow{
    0%, 76%, 100% { box-shadow:0 2px 8px rgba(25,21,16,0.04); border-color:var(--line); }
    38% { box-shadow:0 4px 18px rgba(27,79,224,0.22); border-color:var(--blue); }
  }
  .link-btn.primary{ animation:btn-glow-primary 3.6s ease-in-out infinite; }
  .link-btn.primary:nth-child(1){ animation-delay:0s; }
  @keyframes btn-glow-primary{
    0%, 76%, 100% { box-shadow:0 6px 16px rgba(27,79,224,0.28); }
    38% { box-shadow:0 10px 26px rgba(27,79,224,0.42); }
  }
  @media (prefers-reduced-motion: reduce){
    .link-btn{ animation:none !important; }
  }

  .link-btn .icon{
    width:46px; height:46px; min-width:46px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; background:var(--panel);
  }
  .link-btn.primary .icon{background:rgba(255,255,255,0.20);}
  .link-btn .txt{flex:1;}
  .link-btn .txt .main{font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:var(--ink); display:block;}
  .link-btn .txt .sub{font-size:13px; color:var(--clay); font-weight:600; margin-top:2px; display:block;}
  .link-btn.primary .txt .main{color:#fff;}
  .link-btn.primary .txt .sub{color:rgba(255,255,255,0.8);}
  .link-btn .arrow{color:var(--clay); font-size:18px;}
  .link-btn.primary .arrow{color:rgba(255,255,255,0.8);}
  footer{margin-top:32px; font-size:12px; color:var(--clay);}
</style>
</head>
<body>
  <div class="card">
    <div class="hero-block">
      <div class="logo">BLINDA<span>CELL</span></div>
      <p class="subtitle">Blindagem profissional de celulares</p>
      <p class="cta-line">👇 Toque em uma opção abaixo</p>
    </div>

    <div class="links">
      <a class="link-btn primary" href="https://blindacell.shop" target="_blank">
        <span class="icon">🎓</span>
        <span class="txt">
          <span class="main">Curso Blindacell</span>
          <span class="sub">Aprenda a técnica e comece a faturar</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://chat.whatsapp.com/EVWbcuZMVo5H0sJrqABLFH" target="_blank">
        <span class="icon">⭐</span>
        <span class="txt">
          <span class="main">Grupo VIP</span>
          <span class="sub">Descontos e novidades</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://wa.me/5547984638658?text=Ol%C3%A1!%20Vim%20pelo%20Instagram%20e%20quero%20agendar%20uma%20blindagem." target="_blank">
        <span class="icon">📅</span>
        <span class="txt">
          <span class="main">Agendar Blindagem</span>
          <span class="sub">Fale direto no WhatsApp</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://g.page/r/CVQ8NlX9aT5jEBM/review" target="_blank">
        <span class="icon">🌟</span>
        <span class="txt">
          <span class="main">Avaliar no Google</span>
          <span class="sub">Deixe sua avaliação</span>
        </span>
        <span class="arrow">›</span>
      </a>
    </div>

    <footer>© 2026 Blindacell</footer>
  </div>
</body>
</html>
