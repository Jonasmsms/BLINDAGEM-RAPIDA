<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindacell — Links</title>
<meta name="description" content="Todos os links da Blindacell: grupo VIP, agendamento, avaliações e curso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700&display=optional">
<style>
  :root{
    --ink:#191510;
    --ink-soft:#4A443C;
    --clay:#6B6153;
    --blue:#1B4FE0;
    --paper:#F4F1EA;
    --panel:#EDE8DD;
    --line: rgba(25,21,16,0.12);
    --green:#3F6B32;
    --green-bg:#E7F0E3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .card{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .logo{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin-bottom:6px;
  }
  .logo span{color:var(--blue);}
  .subtitle{
    font-size:15px;
    color:var(--clay);
    font-weight:600;
    margin-bottom:8px;
  }
  .cta-line{
    font-size:14px;
    font-weight:800;
    color:var(--blue);
    margin-bottom:28px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-btn{
    display:flex;
    align-items:center;
    gap:16px;
    text-decoration:none;
    padding:18px 20px;
    border-radius:16px;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 2px 10px rgba(25,21,16,0.05);
    text-align:left;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .link-btn:active{transform:scale(0.97);}
  .link-btn .icon{
    width:46px; height:46px; min-width:46px;
    border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    font-size:21px;
    background:var(--panel);
  }
  .link-btn.primary .icon{background:var(--blue); color:#fff;}
  .link-btn .txt{flex:1;}
  .link-btn .txt .main{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
    display:block;
  }
  .link-btn .txt .sub{
    font-size:13px;
    color:var(--clay);
    font-weight:600;
    margin-top:2px;
    display:block;
  }
  .link-btn .arrow{color:var(--clay); font-size:18px;}
  footer{margin-top:32px; font-size:12px; color:var(--clay);}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">BLINDA<span>CELL</span></div>
    <p class="subtitle">Blindagem profissional de celulares</p>
    <p class="cta-line">👇 Toque em uma opção abaixo</p>

    <div class="links">
      <a class="link-btn primary" href="#" id="link-grupo-vip">
        <span class="icon">⭐</span>
        <span class="txt">
          <span class="main">Grupo VIP</span>
          <span class="sub">Descontos e novidades</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://wa.me/5547984638658?text=Ol%C3%A1!%20Vim%20pelo%20Instagram%20e%20quero%20agendar%20uma%20blindagem." target="_blank">
        <span class="icon">📅</span>
        <span class="txt">
          <span class="main">Agendar Blindagem</span>
          <span class="sub">Fale direto no WhatsApp</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://g.page/r/CVQ8NlX9aT5jEBM/review" id="link-avaliacao" target="_blank">
        <span class="icon">⭐</span>
        <span class="txt">
          <span class="main">Avaliar no Google</span>
          <span class="sub">Deixe sua avaliação</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-btn" href="https://blindacell.shop" target="_blank">
        <span class="icon">🎓</span>
        <span class="txt">
          <span class="main">Curso Blindacell</span>
          <span class="sub">Aprenda a técnica e comece a atender</span>
        </span>
        <span class="arrow">›</span>
      </a>
    </div>

    <footer>© 2026 Blindacell</footer>
  </div>
</body>
</html>
